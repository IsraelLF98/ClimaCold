<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#062244"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70cbf4"/>
      <stop offset="50%" stop-color="#38b6ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo distintivo con esquinas redondeadas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Estructura de Copo de Nieve Frigorífico -->
  <g stroke="url(#iceGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L230 196 M256 170 L282 196" stroke-width="18"/>
    <g transform="rotate(60 256 256)">
      <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L230 196 M256 170 L282 196" stroke-width="18"/>
    </g>
    <g transform="rotate(120 256 256)">
      <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L282 196" stroke-width="18"/>
    </g>
    <g transform="rotate(180 256 256)">
      <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L230 196 M256 170 L282 196" stroke-width="18"/>
    </g>
    <g transform="rotate(240 256 256)">
      <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L282 196" stroke-width="18"/>
    </g>
    <g transform="rotate(300 256 256)">
      <path d="M256 256 V 65 M256 120 L216 160 M256 120 L296 160 M256 170 L282 196" stroke-width="18"/>
    </g>
  </g>
  
  <!-- Anillo/Base circular blanca -->
  <circle cx="256" cy="256" r="115" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Letra C distintiva de ClimaCold -->
  <path d="M 330 190 A 90 90 0 1 0 330 322" fill="none" stroke="#093c71" stroke-width="46" stroke-linecap="round"/>
</svg>
